services:
  app:
    build:
      context: .
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
    command:
      - --oom
      - --chunk-mb=1
      - --report-every-mb=8
      - --delay-ms=1000
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app
    networks:
      - monitoring

networks:
  monitoring:

volumes:
  prometheus-data:
