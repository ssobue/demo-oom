spring:
  application:
    name: demo-oom
  main:
    banner-mode: off
  profiles:
    active: dev

logging:
  level:
    root: info
    org.springframework: warn

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
